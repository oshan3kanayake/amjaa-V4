<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Amja Travels — Hajj, Umrah & air tickets, Colombo</title>
<meta name="description" content="Talk to Amja Travels in Colombo about Hajj, Umrah and air tickets. Phone, WhatsApp, email or send an enquiry.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/outbound.css">
<script>document.documentElement.classList.add('anim');setTimeout(function(){if(!window.gsap)document.documentElement.classList.remove('anim')},4000)</script>
</head>
<body data-page="contact.html" class="page-light">
<div class="curtain"><svg class="mark" viewBox="0 0 104 64"><path d="M4 60 31 5l27 55" fill="none" stroke="currentColor" stroke-width="7.5"/><path d="M19 60 31 36l12 24" fill="none" stroke="currentColor" stroke-width="6"/><path d="M52 8h48M76 8v52" fill="none" stroke="currentColor" stroke-width="8"/></svg></div>
<div id="layout-top"></div>
<main>
  <section class="sec" style="padding-top:clamp(140px,18vw,220px)">
    <div class="wrap contact-grid">
      <div>
        <p class="eyebrow">Contact</p>
        <h1 class="h-lg" data-split="now" style="margin-top:18px">Say hello. <em>A person will answer.</em></h1>
        <p class="lead" style="margin-top:24px" data-fade>Planning Hajj or Umrah, or need a flight — tell us a little and we'll reply within one working day (usually much sooner).</p>
        <div class="cinfo" data-fade>
          <a data-site-href="phone" href="#"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span><span><small>Office</small><span data-site="phone"></span></span></a>
          <a data-site-href="whatsapp" href="#" target="_blank" rel="noopener"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg></span><span><small>WhatsApp</small><span data-site="phone2"></span></span></a>
          <a data-site-href="email" href="#"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span><span><small>Email</small><span data-site="email"></span></span></a>
          <div><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span><small>Head office</small><span data-site="address"></span></span></div>
        </div>
      </div>
      <div class="form-card" data-fade>
        <h3>Send an enquiry</h3>
        <p class="muted">We reply within one working day — usually sooner.</p>
        <form class="form" data-enquiry="general">
          <span class="enq-chip" hidden></span>
          <div class="row"><div class="field"><input name="name" placeholder=" " required><label>Your name</label></div><div class="field"><input name="phone" type="tel" placeholder=" " required><label>Phone / WhatsApp</label></div></div>
          <div class="row"><div class="field"><input name="email" type="email" placeholder=" "><label>Email</label></div><div class="field"><select name="country"></select></div></div>
          <div class="row">
            <div class="field"><select name="interest"><option value="">I'm interested in…</option><option>Hajj</option><option>Umrah</option><option>Air ticket</option><option>Visa help</option><option>Something else</option></select></div>
            <div class="field"><input name="travel_dates" placeholder=" "><label>Travel dates (approx.)</label></div>
          </div>
          <div class="field"><textarea name="message" placeholder=" " required></textarea><label>How can we help?</label></div>
          <button class="btn btn-lg btn-accent" type="submit">Send message <span class="arr">→</span></button>
          <p class="form-status" role="status"></p>
        </form>
      </div>
    </div>
  </section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="map-embed" data-clip><iframe id="mapFrame" title="Amja office map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div></section>
</main>
<div id="layout-bottom"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script type="module" src="assets/js/pages/page.js"></script>
</body>
</html>
